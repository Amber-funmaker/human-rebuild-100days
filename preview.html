<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>26岁人类修技 · 预览版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --rose: #d4967e;
            --rose-light: #e8c4b8;
            --gold: #c9a96e;
            --cream: #f5ede4;
            --ink: #3d2b2b;
            --soft: #8a6a62;
            --bg: #f7f0e8;
            --parchment: #ede3d6;
        }
        body {
            font-family: "PingFang SC", "Microsoft YaHei", "STKaiti", serif;
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: 
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E"),
                linear-gradient(135deg, rgba(212,150,126,0.06) 0%, rgba(201,169,110,0.04) 50%, rgba(232,196,184,0.08) 100%);
            pointer-events: none;
            z-index: 0;
        }

        /* Demo Banner */
        .demo-banner {
            background: linear-gradient(90deg, var(--rose), var(--gold));
            text-align: center;
            padding: 10px;
            font-size: 12px;
            color: white;
            letter-spacing: 2px;
        }

        /* 页眉 */
        .ornate-header { text-align: center; padding: 30px 20px 24px; }
        .ornate-divider { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 16px; }
        .ornate-line { width: 50px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
        .ornate-symbol { font-size: 14px; color: var(--gold); }
        .main-title { font-size: 30px; font-weight: 400; letter-spacing: 5px; color: var(--ink); font-family: "STKaiti", serif; margin-bottom: 4px; }
        .subtitle { font-size: 11px; letter-spacing: 3px; color: var(--soft); font-style: italic; }

        /* 阶段横幅 */
        .scroll-banner {
            max-width: 480px; margin: 0 auto 20px; padding: 18px 28px;
            background: var(--parchment); border: 1px solid rgba(201,169,110,0.3);
            border-radius: 4px; position: relative;
            box-shadow: 0 3px 16px rgba(61,43,43,0.06);
            text-align: center;
        }
        .scroll-banner::before, .scroll-banner::after { content: '❧'; position: absolute; top: 50%; transform: translateY(-50%); font-size: 16px; color: var(--gold); opacity: 0.4; }
        .scroll-banner::before { left: 8px; }
        .scroll-banner::after { right: 8px; transform: translateY(-50%) scaleX(-1); }
        .era-label { font-size: 9px; letter-spacing: 3px; color: var(--gold); text-transform: uppercase; margin-bottom: 6px; }
        .phase-title { font-size: 20px; font-weight: 400; color: var(--ink); font-family: "STKaiti", serif; }
        .scroll-quote { font-size: 10px; color: var(--soft); font-style: italic; margin-top: 6px; }

        /* 进度 */
        .progress-wrap { max-width: 480px; margin: 0 auto 20px; padding: 0 20px; }
        .progress-meta { display: flex; justify-content: space-between; font-size: 10px; color: var(--soft); margin-bottom: 5px; }
        .progress-track { height: 3px; background: rgba(201,169,110,0.15); border-radius: 2px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--rose), var(--gold)); border-radius: 2px; }

        /* 导航tab */
        .nav-tabs { display: flex; justify-content: center; gap: 4px; max-width: 480px; margin: 0 auto 20px; padding: 0 20px; }
        .nav-tab { padding: 8px 16px; border-radius: 20px; font-size: 11px; background: var(--parchment); border: 1px solid rgba(201,169,110,0.2); color: var(--soft); cursor: pointer; }
        .nav-tab.active { background: var(--rose); color: white; border-color: var(--rose); }

        /* 内容区 */
        .content { max-width: 480px; margin: 0 auto; padding: 0 16px 80px; }

        /* 日历 */
        .calendar-legend { display: flex; justify-content: center; gap: 16px; margin-bottom: 10px; font-size: 10px; color: #b0a090; }
        .legend-item { display: flex; align-items: center; gap: 4px; }
        .legend-dot { width: 7px; height: 7px; border-radius: 2px; }
        .legend-dot.done { background: var(--rose); }
        .legend-dot.today { border: 1.5px solid var(--gold); background: transparent; }
        .legend-dot.future { background: rgba(201,169,110,0.08); }
        .calendar-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
        .day-cell { aspect-ratio: 1; border-radius: 5px; display: flex; align-items: center; justify-content: center; background: rgba(201,169,110,0.06); border: 1px solid rgba(201,169,110,0.1); }
        .day-cell.done { background: linear-gradient(145deg, var(--rose-light), var(--rose)); border-color: var(--rose); }
        .day-cell.today { border: 1.5px solid var(--gold); background: rgba(232,212,168,0.12); }
        .day-cell.future { opacity: 0.3; }
        .day-num { font-size: 9px; color: var(--soft); font-style: italic; }
        .day-cell.done .day-num, .day-cell.today .day-num { color: white; font-weight: 500; }
        .day-cell.today .day-num { color: var(--gold); }

        /* 技能卡片 */
        .skill-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .skill-card { background: white; border-radius: 12px; padding: 16px; border: 1px solid rgba(201,169,110,0.15); }
        .skill-card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
        .skill-icon { font-size: 20px; }
        .skill-name { font-size: 13px; font-weight: 600; color: var(--ink); }
        .skill-level { font-size: 9px; color: var(--gold); letter-spacing: 1px; margin-left: auto; }
        .skill-bar { height: 3px; background: rgba(201,169,110,0.15); border-radius: 2px; overflow: hidden; margin-bottom: 8px; }
        .skill-fill { height: 100%; border-radius: 2px; }
        .skill-goal { font-size: 10px; color: var(--soft); line-height: 1.5; }
        .skill-reward { font-size: 10px; color: var(--gold); margin-top: 6px; }

        /* 目标清单 */
        .goals-section { margin-bottom: 24px; }
        .goals-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
        .goals-icon { font-size: 18px; }
        .goals-title { font-size: 14px; font-weight: 600; color: var(--ink); }
        .goals-subtitle { font-size: 10px; color: var(--soft); margin-left: auto; }
        .goal-item {
            background: white; border-radius: 10px; padding: 14px 16px; margin-bottom: 10px;
            border: 1px solid rgba(201,169,110,0.12); display: flex; align-items: flex-start; gap: 12px;
        }
        .goal-item.done { opacity: 0.7; }
        .goal-check {
            width: 20px; height: 20px; border-radius: 50%;
            background: var(--rose); border: 1.5px solid var(--rose);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; margin-top: 1px; font-size: 11px; color: white;
        }
        .goal-item:not(.done) .goal-check { background: transparent; border-color: rgba(201,169,110,0.3); }
        .goal-content { flex: 1; }
        .goal-name { font-size: 13px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
        .goal-desc { font-size: 11px; color: var(--soft); line-height: 1.5; }
        .goal-output { font-size: 10px; color: var(--gold); margin-top: 6px; padding: 5px 10px; background: rgba(201,169,110,0.06); border-radius: 6px; display: inline-block; }
        .goal-reward { font-size: 10px; color: var(--rose); margin-left: auto; white-space: nowrap; align-self: center; }

        /* 奖励区 */
        .rewards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
        .reward-item {
            background: white; border-radius: 12px; padding: 16px 12px;
            text-align: center; border: 1px solid rgba(201,169,110,0.12);
        }
        .reward-item.earned { border-color: var(--rose); background: rgba(212,150,126,0.08); }
        .reward-item.locked { opacity: 0.4; }
        .reward-icon { font-size: 24px; margin-bottom: 8px; }
        .reward-name { font-size: 11px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
        .reward-condition { font-size: 9px; color: var(--soft); line-height: 1.4; }
        .reward-status { font-size: 10px; margin-top: 6px; font-weight: 600; color: var(--rose); }

        /* 成绩单 */
        .report-card { background: white; border-radius: 10px; padding: 16px; margin-bottom: 12px; border: 1px solid rgba(201,169,110,0.12); }
        .report-title { font-size: 10px; letter-spacing: 2px; color: var(--gold); margin-bottom: 10px; text-transform: uppercase; }
        .report-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid rgba(201,169,110,0.06); font-size: 12px; }
        .report-key { color: var(--soft); }
        .report-val { font-weight: 600; color: var(--ink); }

        /* Readonly notice */
        .readonly-notice {
            background: var(--parchment);
            border: 1px solid rgba(201,169,110,0.2);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }
        .readonly-notice .icon { font-size: 28px; margin-bottom: 10px; }
        .readonly-notice .title { font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
        .readonly-notice .desc { font-size: 11px; color: var(--soft); line-height: 1.6; }

        /* 四维卡片 */
        .dims { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .dim-card {
            background: var(--parchment); border: 1px solid rgba(201,169,110,0.2);
            border-radius: 8px; padding: 16px; position: relative;
        }
        .dim-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; border-radius: 8px 8px 0 0; }
        .dim-card.mind::before { background: linear-gradient(90deg, #c97c8e, #e8a0b4); }
        .dim-card.skill::before { background: linear-gradient(90deg, #9b8a7a, #d4a574); }
        .dim-card.body::before { background: linear-gradient(90deg, #8a9a7a, #a8b89a); }
        .dim-card.rel::before { background: linear-gradient(90deg, #c9a0b4, #d4a0c0); }
        .dim-icon { font-size: 20px; margin-bottom: 6px; }
        .dim-name { font-size: 12px; font-weight: 600; color: var(--ink); margin-bottom: 3px; }
        .dim-count { font-size: 9px; color: var(--soft); letter-spacing: 1px; }

        /* 日志 */
        .log-list { margin-top: 16px; }
        .log-item { padding: 14px 0; border-bottom: 1px solid rgba(201,169,110,0.1); }
        .log-item:last-child { border-bottom: none; }
        .log-time { font-size: 10px; color: #b0a090; margin-bottom: 5px; }
        .log-body { font-size: 13px; color: #5a4a46; line-height: 1.6; }
        .log-q { font-style: italic; color: var(--ink); }
        .log-a { margin-top: 4px; color: var(--soft); font-size: 12px; }

        @media (max-width: 480px) {
            .main-title { font-size: 24px; }
            .skill-cards { grid-template-columns: 1fr 1fr; gap: 8px; }
            .rewards-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <!-- Demo Banner -->
    <div class="demo-banner">👀 这是 Amber 的100天记录 · 预览版</div>

    <div class="ornate-header">
        <div class="ornate-divider"><span class="ornate-line"></span><span class="ornate-symbol">✿</span><span class="ornate-line"></span></div>
        <div class="main-title">二十六岁</div>
        <div class="subtitle">CARRIE · 一百天重建自我</div>
    </div>

    <!-- 阶段横幅 -->
    <div class="scroll-banner">
        <div class="era-label">ERA 01 / 10</div>
        <div class="phase-title">认识自我</div>
        <div class="scroll-quote">"认识你自己"——德尔斐神庙上的箴言</div>
    </div>

    <!-- 进度 -->
    <div class="progress-wrap">
        <div class="progress-meta">
            <span>第 7 天</span>
            <span>7%</span>
        </div>
        <div class="progress-track"><div class="progress-fill" style="width:7%"></div></div>
    </div>

    <!-- 导航tab -->
    <div class="nav-tabs">
        <div class="nav-tab active" onclick="switchTab('calendar')">📅 日历</div>
        <div class="nav-tab" onclick="switchTab('skills')">⚡ 技能</div>
        <div class="nav-tab" onclick="switchTab('goals')">🎯 目标</div>
        <div class="nav-tab" onclick="switchTab('rewards')">🎁 奖励</div>
    </div>

    <!-- 内容区 -->
    <div class="content" id="contentArea"></div>

    <script>
    // ===== 预填充的示例数据 =====
    const DEMO_DATA = {
        days: {
            1: { skills:{ai:3}, body:{weight:54.5}, note:'开始学习AI提示词工程，感觉打开了新世界的大门。' },
            2: { skills:{ai:6}, body:{weight:54.3}, note:'练习了角色法和框架法，写出了第一份AI辅助策划案。' },
            3: { skills:{ai:9}, body:{train:'功能性训练'} },
            4: { skills:{ai:12, platform:3}, body:{weight:54.1} },
            5: { skills:{ai:15, platform:6}, body:{weight:53.9}, note:'开始理解不同平台的消费逻辑，很有启发。' },
            6: { skills:{ai:18, platform:9}, body:{train:'拉伸/柔韧性'} },
            7: { skills:{ai:21, platform:12}, body:{weight:53.8, train:'核心激活'}, note:'Week 1完成！AI提示词工程基础打卡完毕。' }
        },
        skills: { ai:21, platform:12, data:0, content:0, visual:0 },
        goals: { g1:true, g2:false, g3:false, g4:false, g5:false, g6:false, g7:false, g8:false, g9:false, g10:false, g11:false },
        rewards: { r1:true },
        body: { weights:[{v:54.5},{v:54.3},{v:54.1},{v:53.9},{v:53.8}], trainings:[] },
        rels: [
            { t:'6月5日', diary:'和久违的朋友吃了顿饭，聊了很多关于未来的想法。有人支持的感觉很好。' },
            { t:'6月3日', diary:'给自己买了一束花，放在书桌前。每天看到心情都会变好。' }
        ]
    };

    const SKILLS = [
        { id:'ai', name:'AI工具链', icon:'🤖', color:'#c97c8e', days:'1-25', desc:'用AI替代一个小型团队' },
        { id:'data', name:'数据分析', icon:'📊', color:'#8090a0', days:'26-50', desc:'用数据证明你的决策是对的' },
        { id:'content', name:'内容创作', icon:'✍️', color:'#a090b0', days:'51-75', desc:'线下活动→线上内容的完整闭环' },
        { id:'visual', name:'视觉设计', icon:'🎨', color:'#c08080', days:'76-100', desc:'一个人也能做出专业级视觉' }
    ];

    const GOALS = [
        { id:'g1', skill:'ai', name:'AI提示词工程基础', desc:'学习结构化提示词：角色法/框架法/例子法', output:'📤 AI辅助策划案初稿', reward:'🍷 一瓶酒', days:'1-14' },
        { id:'g2', skill:'ai', name:'AI视觉生成入门', desc:'掌握Midjourney/可灵/liblib，用AI生成活动主视觉', output:'📤 品牌活动视觉素材包', reward:'💆 一次按摩', days:'15-25' },
        { id:'g3', skill:'data', name:'数据采集与整理', desc:'Excel高级函数 + 基础SQL，从0搭建活动数据仪表盘', output:'📤 活动数据仪表盘', reward:'🎬 一场电影', days:'26-35' },
        { id:'g4', skill:'data', name:'数据分析思维', desc:'用户旅程数据拆解、转化漏斗、ROI计算', output:'📤 活动复盘数据分析报告', reward:'🛁 泡个澡', days:'36-47' },
        { id:'g5', skill:'data', name:'数据驱动决策', desc:'从数据到洞察，从洞察到下次活动优化方向', output:'📤 数据驱动的活动优化方案', reward:'🛍️ 买想要的东西', days:'48-50' },
        { id:'g6', skill:'content', name:'内容生产SOP', desc:'活动预热/现场/复盘的内容生产SOP', output:'📤 活动内容生产模板', reward:'🍷 一瓶酒', days:'51-58' },
        { id:'g7', skill:'content', name:'传播链路设计', desc:'设计3条完整传播链路（小红书/抖音/微信）', output:'📤 线上反哺方案', reward:'🌅 出去玩一天', days:'59-68' },
        { id:'g8', skill:'content', name:'KOL/UGC思维', desc:'如何让参与者变成传播者', output:'📤 "参与者即传播者"方案', reward:'💆 一次按摩', days:'69-75' },
        { id:'g9', skill:'visual', name:'设计基础', desc:'版式/色彩/字体/品牌视觉逻辑', output:'📤 个人视觉风格指南', reward:'🛁 泡个澡', days:'76-85' },
        { id:'g10', skill:'visual', name:'Canva+AI设计', desc:'快速出图工作流', output:'📤 品牌活动视觉模板包', reward:'🎬 一场电影', days:'86-93' },
        { id:'g11', skill:'visual', name:'整合输出', desc:'整理前13周所有输出，做成"超级个体技术手册"', output:'📤 完整作品集', reward:'🏆 三个月完整通关', days:'94-100' }
    ];

    const REWARDS = [
        { id:'r1', icon:'🍷', name:'一瓶酒', condition:'Week 1 完成', conditionDesc:'Week 1 完成' },
        { id:'r2', icon:'💆', name:'一次按摩', condition:'Week 2 完成', conditionDesc:'Week 2 完成' },
        { id:'r3', icon:'🎬', name:'一场电影', condition:'Week 5 完成', conditionDesc:'Week 5 完成' },
        { id:'r4', icon:'🛁', name:'泡个澡', condition:'Week 6 完成', conditionDesc:'Week 6-7 完成' },
        { id:'r5', icon:'🛍️', name:'买想要的东西', condition:'Week 8 完成', conditionDesc:'Week 8 完成' },
        { id:'r6', icon:'🌅', name:'出去玩一天', condition:'Week 10 完成', conditionDesc:'Week 10 完成' },
        { id:'r7', icon:'💆', name:'一次按摩', condition:'Week 11 完成', conditionDesc:'Week 11 完成' },
        { id:'r8', icon:'🛁', name:'泡个澡', condition:'Week 12 完成', conditionDesc:'Week 12 完成' },
        { id:'r9', icon:'🎬', name:'一场电影', condition:'Week 13 完成', conditionDesc:'Week 13 完成' },
        { id:'r10', icon:'🏆', name:'完整通关', condition:'全部100天完成', conditionDesc:'100天 完成' }
    ];

    let currentTab = 'calendar';

    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.toggle('active', t.textContent.includes(['📅','⚡','🎯','🎁'][[['calendar','skills','goals','rewards'].indexOf(tab)]])));
        // 简单处理
        document.querySelectorAll('.nav-tab').forEach((t, i) => {
            const tabs = ['calendar','skills','goals','rewards'];
            t.classList.toggle('active', tabs[i] === tab);
        });
        renderContent();
    }

    function renderContent() {
        const d = DEMO_DATA;
        const area = document.getElementById('contentArea');

        if (currentTab === 'calendar') {
            // 构建已打卡的天数
            const doneDays = Object.keys(d.days).map(Number);
            
            // 获取最近一条日志
            const latestNote = d.days[7]?.note || d.days[6]?.note || '';
            
            area.innerHTML = `
                <div class="readonly-notice">
                    <div class="icon">👀</div>
                    <div class="title">这是 Amber 的记录预览</div>
                    <div class="desc">数据已锁定，只供查看无法修改。<br>想自己开始100天挑战？联系 Amber 获取完整版。</div>
                </div>
                
                <div class="calendar-legend">
                    <div class="legend-item"><div class="legend-dot done"></div><span>已打卡</span></div>
                    <div class="legend-item"><div class="legend-dot today"></div><span>今天</span></div>
                    <div class="legend-item"><div class="legend-dot future"></div><span>未开始</span></div>
                </div>
                <div class="calendar-grid">
                    ${Array.from({length:100},(_,i)=>{
                        const n = i+1;
                        const isDone = doneDays.includes(n);
                        const isToday = n === 7;
                        const isFuture = n > 7;
                        let cls = '';
                        if (isDone) cls = 'done';
                        else if (isToday) cls = 'today';
                        else if (isFuture) cls = 'future';
                        return `<div class="day-cell ${cls}"><span class="day-num">${n}</span></div>`;
                    }).join('')}
                </div>

                <!-- 最新打卡 -->
                <div style="margin-top:20px;">
                    <div class="report-card">
                        <div class="report-title">📋 最新成绩单 · Day 7</div>
                        <div class="report-row"><span class="report-key">🤖 AI工具链</span><span class="report-val">+21%</span></div>
                        <div class="report-row"><span class="report-key">🔗 平台方法论</span><span class="report-val">+12%</span></div>
                        <div class="report-row"><span class="report-key">💪 体重</span><span class="report-val">53.8kg</span></div>
                        <div class="report-row"><span class="report-key">🏋️ 训练</span><span class="report-val">核心激活</span></div>
                    </div>
                    ${latestNote ? `<div class="report-card"><div class="report-title">📝 Day 7 日记</div><div style="font-size:12px;color:var(--ink);line-height:1.7">${latestNote}</div></div>` : ''}
                </div>

                <!-- 四维概览 -->
                <div class="goals-header" style="margin-top:24px;">
                    <span class="goals-icon">📊</span>
                    <span class="goals-title">进度概览</span>
                </div>
                <div class="dims">
                    <div class="dim-card mind">
                        <div class="dim-icon">🧠</div>
                        <div class="dim-name">心智</div>
                        <div class="dim-count">7天 · 持续探索中</div>
                    </div>
                    <div class="dim-card body">
                        <div class="dim-icon">💪</div>
                        <div class="dim-name">体魄</div>
                        <div class="dim-count">53.8kg · 累计-0.7kg</div>
                    </div>
                    <div class="dim-card rel">
                        <div class="dim-icon">🌏</div>
                        <div class="dim-name">世界参与</div>
                        <div class="dim-count">2条日记</div>
                    </div>
                    <div class="dim-card skill">
                        <div class="dim-icon">⚡</div>
                        <div class="dim-name">技能链</div>
                        <div class="dim-count">AI工具链进行中</div>
                    </div>
                </div>
            `;

        } else if (currentTab === 'skills') {
            area.innerHTML = `
                <div class="skill-cards">
                    ${SKILLS.map(s => {
                        const skillProgress = d.skills[s.id] || 0;
                        const goalsOfSkill = GOALS.filter(g => g.skill === s.id);
                        const completedGoals = goalsOfSkill.filter(g => d.goals[g.id]).length;
                        const isLocked = 7 < parseInt(s.days.split('-')[0]);
                        return `
                        <div class="skill-card ${isLocked ? 'locked' : ''}">
                            <div class="skill-card-header">
                                <span class="skill-icon">${s.icon}</span>
                                <span class="skill-name">${s.name}</span>
                                <span class="skill-level">${completedGoals}/${goalsOfSkill.length} 目标</span>
                            </div>
                            <div class="skill-bar"><div class="skill-fill" style="width:${skillProgress}%;background:linear-gradient(90deg,${s.color},${s.color}88)"></div></div>
                            <div class="skill-goal">${s.desc}</div>
                            <div class="skill-reward">📅 ${s.days} 天</div>
                        </div>`;
                    }).join('')}
                </div>
            `;

        } else if (currentTab === 'goals') {
            area.innerHTML = `
                <div class="goals-section">
                    <div class="goals-header">
                        <span class="goals-icon">🎯</span>
                        <span class="goals-title">学习目标清单</span>
                        <span class="goals-subtitle">${Object.values(d.goals).filter(Boolean).length}/${GOALS.length} 已完成</span>
                    </div>
                    ${GOALS.map(g => `
                    <div class="goal-item ${d.goals[g.id] ? 'done' : ''}">
                        <div class="goal-check">${d.goals[g.id] ? '✓' : ''}</div>
                        <div class="goal-content">
                            <div class="goal-name">${g.name}</div>
                            <div class="goal-desc">${g.desc}</div>
                            <div class="goal-output">${g.output}</div>
                        </div>
                        <div class="goal-reward">${g.reward}</div>
                    </div>`).join('')}
                </div>
            `;

        } else if (currentTab === 'rewards') {
            area.innerHTML = `
                <div class="goals-header">
                    <span class="goals-icon">🎁</span>
                    <span class="goals-title">奖励清单</span>
                    <span class="goals-subtitle">${Object.values(d.rewards).filter(Boolean).length}/${REWARDS.length} 已获得</span>
                </div>
                <div class="rewards-grid">
                    ${REWARDS.map(r => {
                        const earned = d.rewards[r.id];
                        const unlocked = !earned && (
                            (r.id === 'r2' && d.goals['g1']) ||
                            (r.id === 'r3' && d.goals['g3']) ||
                            (r.id === 'r4' && d.goals['g4']) ||
                            (r.id === 'r5' && d.goals['g5']) ||
                            (r.id === 'r6' && d.goals['g7']) ||
                            (r.id === 'r7' && d.goals['g8']) ||
                            (r.id === 'r8' && d.goals['g9']) ||
                            (r.id === 'r9' && d.goals['g10']) ||
                            (r.id === 'r10' && Object.keys(d.goals).length >= GOALS.length)
                        );
                        const status = earned ? 'earned' : unlocked ? 'unlocked' : 'locked';
                        return `
                        <div class="reward-item ${status}">
                            <div class="reward-icon">${r.icon}</div>
                            <div class="reward-name">${r.name}</div>
                            <div class="reward-condition">${r.conditionDesc}</div>
                            <div class="reward-status">${{ earned:'🎉 已获得', unlocked:'✨ 可领取', locked:'🔒 未解锁' }[status]}</div>
                        </div>`;
                    }).join('')}
                </div>
            `;
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        renderContent();
    });
    </script>
</body>
</html>
